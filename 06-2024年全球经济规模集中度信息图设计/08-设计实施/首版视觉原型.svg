<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1110" role="img" aria-labelledby="tit desc">
<title id="tit">全球经济版图：2024年GDP前十经济体占世界经济多少？</title><desc id="desc">世界银行2025年12月发布的2024年名义GDP数据：前十经济体占世界GDP的66.5%。</desc>
<rect width="1200" height="1110" fill="#F5F2EC"/>
<text x="75" y="65" font-size="18" font-family="Arial,sans-serif" font-weight="700" fill="#53646A" letter-spacing="3">GLOBAL POLITICAL ECONOMY · GDP 2024</text>
<text x="75" y="128" font-size="46" font-family="Arial,sans-serif" font-weight="800" fill="#162E36">全球经济版图</text>
<text x="75" y="180" font-size="38" font-family="Arial,sans-serif" font-weight="700" fill="#162E36">前十经济体占世界多少？</text>
<text x="75" y="240" font-size="19" font-family="Arial,sans-serif" fill="#52666C">2024 年 GDP（现价美元）· 世界总量约 110.98 万亿美元</text>
<text x="75" y="318" font-size="61" font-family="Arial,sans-serif" font-weight="800" fill="#162E36">66.5%</text>
<text x="333" y="313" font-size="23" font-family="Arial,sans-serif" fill="#162E36">世界GDP由前十经济体贡献</text>
<text x="333" y="346" font-size="17" font-family="Arial,sans-serif" fill="#637277">其余世界占 33.5%（计算余量）</text>
<rect x="75" y="382" width="628.1791971991012" height="42" rx="2" fill="#234C59"/><rect x="703.1791971991012" y="382" width="316.8208028008988" height="42" fill="#BCC8C6"/>
